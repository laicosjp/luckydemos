name: Deploy demo1 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - demo1/**
      - .github/workflows/deploy-demo1-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo1/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir demo1 install --frozen-lockfile
      - name: Build demo1
        run: pnpm --dir demo1 run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo1/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
